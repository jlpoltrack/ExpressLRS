
# ------------------------- COMMON RP2 DEFINITIONS -----------------
; FLASHING: `pio run -e <env> -t upload` appends the options/hardware layout to firmware.bin,
; rebuilds firmware.uf2 from it and loads that with picotool. Outside a terminal set
; ELRS_UNIFIED_CONFIG (e.g. diy.rx_900.rp2350-lr2021) or the image is bare. Never flash
; firmware.elf, it has no config appended and the RX will not boot.
; Manual flash: hold BOOTSEL while plugging in USB, then drag firmware.uf2 onto the drive or
; picotool load -v -x .pio/build/<env>/firmware.uf2. Any pio command deletes both images,
; so copy them straight after the build.

; Shared by every RP2 RX. HAS_WIFI follows the board's PICO_CYW43_SUPPORTED flag, so a WiFi
; and a non-WiFi target differ only in which board they name. The async libraries stay in
; lib_deps for both; lib_exclusions.py ignores them when the board has no WiFi.
[env_common_rp2rx]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6b8aac4f4cfa6d55a0c4e5b848795150c0
board_build.core = earlephilhower
monitor_speed = 420000
extra_scripts =
	${env.extra_scripts}
	pre:python/copy_html.py
build_flags =
	-D PLATFORM_RP2=1
	${common_env_data.build_flags_rx}
	-include target/Unified_ESP_RX.h
build_src_filter = ${common_env_data.build_src_filter} -<tx_*.cpp> -<tx-*/>
lib_deps =
	ayushsharma82/RPAsyncTCP @ 1.3.2
	esp32async/ESPAsyncWebServer @ 3.8.1
	bblanchon/ArduinoJson @ 7.4.2
	makuna/NeoPixelBus @ 2.8.4
	${common_env_data.mavlink_lib_dep}

; The Updater stages an OTA image in the filesystem region, so the filesystem must be at
; least as large as the firmware it accepts. 4MB part: 2.5MB firmware, 1.5MB to stage into.
[env_common_rp2350rx]
extends = env_common_rp2rx
board = rpipico2w
board_build.filesystem_size = 1.5m

; Pico 2, no CYW43: no web UI and no OTA, flashed over USB with BOOTSEL
[env_common_rp2350rx_nowifi]
extends = env_common_rp2rx
board = rpipico2
board_build.filesystem_size = 1.5m

; 2MB part: 1MB for firmware, 1MB to stage into
[env_common_rp2040rx]
extends = env_common_rp2rx
board = rpipicow
board_build.filesystem_size = 1m

; Pico, no CYW43: no web UI and no OTA, flashed over USB with BOOTSEL
[env_common_rp2040rx_nowifi]
extends = env_common_rp2rx
board = rpipico
board_build.filesystem_size = 1m

[env:Unified_RP2350_LR2021_RX_via_UART]
extends = env_common_rp2350rx, radio_LR2021
build_flags =
	${env_common_rp2350rx.build_flags}
	${radio_LR2021.build_flags}

[env:Unified_RP2350_2400_RX_via_UART]
