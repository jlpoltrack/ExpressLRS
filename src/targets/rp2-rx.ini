
# ------------------------- COMMON RP2 DEFINITIONS -----------------
; Flashing: `pio run -t upload` appends the options/layout to firmware.bin, rebuilds firmware.uf2 and loads it with
; picotool (set ELRS_UNIFIED_CONFIG when headless). Manual: BOOTSEL + copy firmware.uf2; never flash the bare .elf

; RP2 RX, no WiFi: no web UI or WiFi OTA, flashed over USB or over DroneCAN
[env_common_rp2rx]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#372af498f885b827b2ddc10284a8bd0b353bdbd1
board_build.core = earlephilhower
; Laid out for 2MB, the smallest flash on the target boards (Pico, Pico 2, RP2354 in package).
; LittleFS holds options.json and hardware.json
board_upload.maximum_size = 2097152
board_build.filesystem_size = 0.5m
monitor_speed = 420000
build_flags =
	-D PLATFORM_RP2=1
	${common_env_data.build_flags_rx}
	-include target/Unified_ESP_RX.h
build_src_filter = ${common_env_data.build_src_filter} -<tx_*.cpp> -<tx-*/>
lib_deps =
	bblanchon/ArduinoJson @ 7.4.2
	makuna/NeoPixelBus @ 2.8.4
	${common_env_data.mavlink_lib_dep}
	${common_env_data.dronecan_lib_dep}
	${common_env_data.dronecan_dsdl_lib_dep}
	${common_env_data.can2040_lib_dep}

[env_common_rp2350rx]
extends = env_common_rp2rx
board = rpipico2

; The Pico's second-stage bootloader (W25Q quad read), so crt0 copies the RAM image quickly
[env_common_rp2040rx]
extends = env_common_rp2rx
board = rpipico

[env:Unified_RP2350_LR2021_RX_via_UART]
extends = env_common_rp2350rx, radio_LR2021
build_flags =
	${env_common_rp2rx.build_flags}
	${radio_LR2021.build_flags}

; MCP251863 CAN FD controller on SPI (can_sck/mosi/miso/cs/int in the layout) rather than can2040
[env:Unified_RP2350_LR2021_CANFD_RX_via_UART]
extends = env:Unified_RP2350_LR2021_RX_via_UART
build_flags =
	${env:Unified_RP2350_LR2021_RX_via_UART.build_flags}
	-D CAN_MCP251XFD=1
	-D CANARD_ENABLE_CANFD=1
lib_deps =
	${env_common_rp2rx.lib_deps}
	${common_env_data.mcp251xfd_lib_dep}

[env:Unified_RP2040_LR2021_RX_via_UART]
extends = env_common_rp2040rx, radio_LR2021
build_flags =
	${env_common_rp2rx.build_flags}
	${radio_LR2021.build_flags}
