
# ------------------------- COMMON RP2350 DEFINITIONS -----------------
; FLASHING: use `pio run -e <env> -t upload`, which appends the options/hardware layout to firmware.bin,
; rebuilds firmware.uf2 from it and loads that with picotool. Outside a terminal set ELRS_UNIFIED_CONFIG
; (e.g. diy.rx_900.rp2350-lr2021) or the image is bare. Never flash firmware.elf: it has no appended
; config and the RX will not boot.
; Manual flash (any pio command deletes both images, so copy them straight after the build):
;   hold BOOTSEL while plugging in USB, then drag firmware.uf2 onto the RP2350 drive, or
;   picotool load -v -x .pio/build/<env>/firmware.uf2
; Recovery: hold BOOTSEL while plugging in USB, then flash again.

[env_common_rp2350rx]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6b8aac4f4cfa6d55a0c4e5b848795150c0
board = rpipico2w
board_build.core = earlephilhower
; LittleFS holds options.json and will stage WiFi OTA images
board_build.filesystem_size = 1.5m
monitor_speed = 420000
extra_scripts =
	${env.extra_scripts}
	pre:python/copy_html.py
build_flags =
	-D PLATFORM_RP2350=1
	${common_env_data.build_flags_rx}
	-include target/Unified_ESP_RX.h
build_src_filter = ${common_env_data.build_src_filter} -<tx_*.cpp> -<tx-*/>
lib_deps =
	ayushsharma82/RPAsyncTCP @ 1.3.2
	esp32async/ESPAsyncWebServer @ 3.8.1
	bblanchon/ArduinoJson @ 7.4.2
	makuna/NeoPixelBus @ 2.8.4
	${common_env_data.mavlink_lib_dep}

[env:Unified_RP2350_LR2021_RX_via_UART]
extends = env_common_rp2350rx, radio_LR2021
build_flags =
	${env_common_rp2350rx.build_flags}
	${radio_LR2021.build_flags}

[env:Unified_RP2350_2400_RX_via_UART]
extends = env_common_rp2350rx, radio_SX128X
build_flags =
	${env_common_rp2350rx.build_flags}
	${radio_SX128X.build_flags}

[env:Unified_RP2350_LR1121_RX_via_UART]
extends = env_common_rp2350rx, radio_LR1121
build_flags =
	${env_common_rp2350rx.build_flags}
	${radio_LR1121.build_flags}
